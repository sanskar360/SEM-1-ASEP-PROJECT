<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <nav class="navbar shadow-sm fixed-top bg-white">
            <a href="{{ url_for('home') }}">
            <img src="{{ url_for('static', filename='Logo.png') }}" class="logo">
            </a>
        </nav>
    </header>
    <div class="cards">
        <div class="sidebar">
            <div class="profile">        
                <img class="user" src="{{ url_for('static', filename='icons/user.png') }}">

                <div class="hi">
                    <span> Hello,</span>
                    <span>{{ session.email }}</span>       
                </div>
            </div>
            <div class="p1">
                <ul>
                    <li class="add"><a href="{{ url_for('add_orders') }}" class="atag">Add Orders</a></li>
                    <li class="add"><a href="{{ url_for('track_orders') }}" class="atag">Track Orders</a></li>
                    <li class="add"><a href="{{ url_for('payments') }}" class="atag">Payment</a></li>
                    <li class="add"><a href="{{ url_for('profile') }}" class="atag">Profile</a></li>
                    <li class="add"><a href="{{ url_for('logout') }}" class="atag"> Logout </a></li>
                </ul>
            </div>
        </div>
        <div class="edit-page">
            <h2 class="pi">Personal Information</h2>
            <div class="container1">
                <div  class="imfo">
                    <h3 class="h3">Username</h3>
                    <div class="space">
                        <p>{{ session.username }}</p>
                    </div>
                </div>

                <div  class="imfo">
                    <h3 class="h3">Email</h3>
                    <div class="space">
                        <p>{{ session.email }}</p>
                    </div>
                </div>
            </div>
            <br><br>
            <div class="container2">
                <div class="imfo">
                    <h3 class="h3">Phone Number</h3>
                    <div class="space">
                        {{ address.phone_no}}
                    </div>
                </div>

                <div  class="imfo1">
                    <h3 class="h3">Alternate Phone Number </h3>
                    <div class="space">
                        {{ address.alternate_phone_no}}
                    </div>
                </div>
            </div>
            <div class="img3">
                <img id="img3" src="{{ url_for('static', filename='image3.jpg') }}">
            </div>
        </div>
    </div>
</body>
</html>
