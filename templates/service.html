<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#1a56db" />
<title>Vega Vastra – Choose a Service</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="vv-page">

<!-- NAV -->
<nav class="vv-nav">
  <a href="{{ url_for('home') }}" class="logo-link">
    <img src="{{ url_for('static', filename='Logo.png') }}" class="logo" alt="Vega Vastra">
  </a>
  <div class="vv-nav-links">
    <a href="#">My Orders</a>
    <a href="#">Prices</a>
    <a href="#">Support</a>
  </div>
  <div class="vv-nav-icons">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
  </div>
</nav>

<!-- MAIN -->
<main class="vv-main">
  <div class="vv-step-pill">Step 1 of 4</div>
  <h1>Choose a Service</h1>
  <p class="vv-sub">Select the type of laundry service you need. We'll show matching vendors next.</p>

  <div class="vv-grid" id="vv-grid">

    <!-- Iron & Press -->
    <input class="vv-service-radio" type="radio" name="vv-service" id="vv-service-iron-press" />
    <label class="vv-card" for="vv-service-iron-press" data-id="iron-press">
      <div class="vv-badge vv-badge-popular">Popular</div>
      <div class="vv-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 16h12.5A3.5 3.5 0 0 1 20 19.5V20H4v-4z"/>
          <path d="M7 16l3-6h5l2 6"/>
          <path d="M11 10V7h4"/>
        </svg>
      </div>
      <div class="vv-card-name">Iron &amp; Press</div>
      <div class="vv-card-desc">Crisp wrinkle-free finish</div>
      <div class="vv-card-meta">
        <div><div class="vv-starting">Starting From</div><div class="vv-price">₹15 / item</div></div>
        <div class="vv-vendors">12 vendors</div>
      </div>
      <div class="vv-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
    </label>

    <!-- Wash & Fold -->
    <input class="vv-service-radio" type="radio" name="vv-service" id="vv-service-wash-fold" />
    <label class="vv-card" for="vv-service-wash-fold" data-id="wash-fold">
      <div class="vv-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="7" y="3" width="10" height="18" rx="2"/>
          <path d="M10 6h4"/>
          <circle cx="12" cy="13" r="3"/>
          <path d="M10.5 13c.8.7 2.2.7 3 0"/>
        </svg>
      </div>
      <div class="vv-card-name">Wash &amp; Fold</div>
      <div class="vv-card-desc">Fresh daily cleaning</div>
      <div class="vv-card-meta">
        <div><div class="vv-starting">Starting From</div><div class="vv-price">₹40 / kg</div></div>
        <div class="vv-vendors">12 vendors</div>
      </div>
      <div class="vv-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
    </label>

    <!-- Dry Clean -->
    <input class="vv-service-radio" type="radio" name="vv-service" id="vv-service-dry-clean" />
    <label class="vv-card" for="vv-service-dry-clean" data-id="dry-clean">
      <div class="vv-badge vv-badge-premium">Premium</div>
      <div class="vv-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 7a2 2 0 1 0-2-2"/>
          <path d="M12 7v3"/>
          <path d="M5 19h14l-7-6-7 6z"/>
          <path d="M8 16h8"/>
        </svg>
      </div>
      <div class="vv-card-name">Dry Clean</div>
      <div class="vv-card-desc">Premium fabric care</div>
      <div class="vv-card-meta">
        <div><div class="vv-starting">Starting From</div><div class="vv-price">₹80 / item</div></div>
        <div class="vv-vendors">12 vendors</div>
      </div>
      <div class="vv-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
    </label>

    <!-- Steam Iron -->
    <input class="vv-service-radio" type="radio" name="vv-service" id="vv-service-steam-iron" />
    <label class="vv-card" for="vv-service-steam-iron" data-id="steam-iron">
      <div class="vv-badge vv-badge-fast">Fast Delivery</div>
      <div class="vv-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 9h9a3 3 0 1 1 0 6H9"/>
          <path d="M3 13h8"/>
          <path d="M6 17h8a2 2 0 1 1 0 4h-2"/>
          <path d="M5 5h11"/>
        </svg>
      </div>
      <div class="vv-card-name">Steam Iron</div>
      <div class="vv-card-desc">Gentle steam treatment</div>
      <div class="vv-card-meta">
        <div><div class="vv-starting">Starting From</div><div class="vv-price">₹25 / item</div></div>
        <div class="vv-vendors">12 vendors</div>
      </div>
      <div class="vv-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
    </label>

    <!-- Wash -->
    <input class="vv-service-radio" type="radio" name="vv-service" id="vv-service-wash" />
    <label class="vv-card" for="vv-service-wash" data-id="wash">
      <div class="vv-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 3s6 6.2 6 10.2A6 6 0 0 1 6 13.2C6 9.2 12 3 12 3z"/>
          <path d="M9.5 14.2a3 3 0 0 0 5 0"/>
        </svg>
      </div>
      <div class="vv-card-name">Wash</div>
      <div class="vv-card-desc">Deep fiber cleaning</div>
      <div class="vv-card-meta">
        <div><div class="vv-starting">Starting From</div><div class="vv-price">₹30 / kg</div></div>
        <div class="vv-vendors">12 vendors</div>
      </div>
      <div class="vv-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
    </label>

    <!-- Iron -->
    <input class="vv-service-radio" type="radio" name="vv-service" id="vv-service-iron" />
    <label class="vv-card" for="vv-service-iron" data-id="iron">
      <div class="vv-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 16h12.5A3.5 3.5 0 0 1 20 19.5V20H4v-4z"/>
          <path d="M7 16l3-6h5l2 6"/>
          <path d="M11 10V7h4"/>
        </svg>
      </div>
      <div class="vv-card-name">Iron</div>
      <div class="vv-card-desc">Standard pressing</div>
      <div class="vv-card-meta">
        <div><div class="vv-starting">Starting From</div><div class="vv-price">₹10 / item</div></div>
        <div class="vv-vendors">12 vendors</div>
      </div>
      <div class="vv-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
    </label>

    <!-- Iron & Wash (pre-selected) -->
    <input class="vv-service-radio" type="radio" name="vv-service" id="vv-service-iron-wash" checked />
    <label class="vv-card" for="vv-service-iron-wash" data-id="iron-wash">
      <div class="vv-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 7a2 2 0 1 0-2-2"/>
          <path d="M12 7v3"/>
          <path d="M5 19h14l-7-6-7 6z"/>
          <path d="M8 16h8"/>
        </svg>
      </div>
      <div class="vv-card-name">Iron &amp; Wash</div>
      <div class="vv-card-desc">Complete garment care</div>
      <div class="vv-card-meta">
        <div><div class="vv-starting">Starting From</div><div class="vv-price">₹50 / kg</div></div>
        <div class="vv-vendors">12 vendors</div>
      </div>
      <div class="vv-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
    </label>

    <!-- Express Wash -->
    <input class="vv-service-radio" type="radio" name="vv-service" id="vv-service-express-wash" />
    <label class="vv-card" for="vv-service-express-wash" data-id="express-wash">
      <div class="vv-badge vv-badge-limited">Limited</div>
      <div class="vv-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9 2h6"/>
          <path d="M12 7v5l3 2"/>
        </svg>
      </div>
      <div class="vv-card-name">Express Wash</div>
      <div class="vv-card-desc">Ready in 2 hours</div>
      <div class="vv-card-meta">
        <div><div class="vv-starting">Starting From</div><div class="vv-price">₹90 / kg</div></div>
        <div class="vv-vendors">12 vendors</div>
      </div>
      <div class="vv-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
    </label>

  </div>
</main>

<!-- FOOTER -->
<div class="vv-footer-bar">
  <div class="vv-footer-logo">Vega Vastra</div>
  <div class="vv-footer-right">
    <div class="vv-steps">
      <div class="vv-dot vv-active"></div>
      <div class="vv-dot"></div>
      <div class="vv-dot"></div>
      <div class="vv-dot"></div>
    </div>
    <button class="vv-btn-continue vv-active" id="vv-cta">
      <span class="vv-btn-label">Continue to Address</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </button>
  </div>
</div>

</body>
</html>
