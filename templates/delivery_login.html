<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Login — Vega Vastra</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='delivery_style.css') }}">
</head>
<body>

<div class="login-page">
    <div class="login-card">

        <!-- Card top banner -->
        <div class="login-card-top">
            <div class="lc-logo"><img src="{{ url_for('static', filename='Logo_dark.png') }}" alt="Vega Vastra" class="login-logo-img"></div>
            <span class="lc-role">🛵 Delivery Portal</span>
        </div>

        <!-- Login form -->
        <div class="login-card-body">
            <h2>Welcome back</h2>
            <p>Sign in to your delivery account to continue</p>

            <form action="" method="POST">

                <div class="form-field">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                        autocomplete="email">
                </div>

                <div class="form-field">
                    <label for="passwords">Password</label>
                    <input
                        type="password"
                        id="passwords"
                        name="passwords"
                        placeholder="Enter your password"
                        required>
                </div>

                <button type="submit" class="btn btn-navy btn-lg btn-full" style="margin-top:8px;">
                    Login &nbsp;&rarr;
                </button>

            </form>

            <p style="text-align:center; margin-top:18px; font-size:13px; color:var(--text-muted);">
                Not a delivery partner?
                <a href="{{ url_for('login') }}" style="color:var(--sky); font-weight:700;">Customer Login</a>
            </p>
        </div>

    </div>
</div>

</body>
</html>
