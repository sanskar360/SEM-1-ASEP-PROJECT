<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Portal - Manage Addresses</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor_dashboard.css') }}">
</head>

<body>
  <div class="admin-layout">

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <aside class="admin-sidebar" id="adminSidebar">
      <div class="sidebar-brand">
        <a href="{{ url_for('vendors_incoming') }}" class="brand-name">Vega<span>Vastra</span></a>
        <span class="brand-role">🏪 Vendor Portal</span>
      </div>
      <nav class="sidebar-nav">
        <span class="nav-section-label">Orders</span>
        <a class="nav-link" href="{{ url_for('vendors_incoming') }}">
          <span class="nl-icon">📥</span><span>Incoming Orders</span>
          <span class="nav-badge">3</span>
        </a>
        <a class="nav-link" href="{{ url_for('vendors_processing') }}">
          <span class="nl-icon">⚙️</span><span>Order Processing</span>
        </a>
        <a class="nav-link" href="{{ url_for('vendors_history') }}">
          <span class="nl-icon">🕐</span><span>Order History</span>
        </a>
        <span class="nav-section-label">Store</span>
        <a class="nav-link" href="{{ url_for('vendors_services') }}">
          <span class="nl-icon">🧺</span><span>Services &amp; Pricing</span>
        </a>
        <a class="nav-link active" href="{{ url_for('vendors_addresses') }}">
          <span class="nl-icon">📍</span><span>Manage Addresses</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="{{ url_for('home') }}" class="logout-link"><span class="nl-icon">🚪</span><span>Logout</span></a>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <div style="display:flex;align-items:center;gap:14px">
          <button class="hamburger" onclick="openSidebar()"><span></span><span></span><span></span></button>
          <span class="topbar-title">Manage Addresses</span>
        </div>
        <div class="topbar-right">
          <span class="topbar-store">Fresh &amp; Clean Laundry</span>
          <div class="topbar-avatar">FC</div>
        </div>
      </header>

      <main class="admin-content">
        <div class="section active" id="sec-addresses">
          <div class="page-header">
            <h1>Manage Addresses</h1>
            <p>Manage the addresses your store operates from</p>
          </div>

          <!-- Add address form -->
          <div class="add-service-card">
            <h3>➕ Add New Address</h3>
            <div class="form-row">
              <div class="form-group" style="grid-column:1/-1">
                <label>Street Address</label>
                <input class="form-control" type="text" placeholder="e.g. 14B, Koregaon Park" id="newAddrStreet">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>City</label>
                <input class="form-control" type="text" placeholder="e.g. Pune" id="newAddrCity">
              </div>
              <div class="form-group">
                <label>State</label>
                <input class="form-control" type="text" placeholder="e.g. Maharashtra" id="newAddrState">
              </div>
              <div class="form-group">
                <label>PIN Code</label>
                <input class="form-control" type="text" placeholder="e.g. 411001" id="newAddrPin" maxlength="6">
              </div>
              <div class="form-group">
                <label>Phone</label>
                <input class="form-control" type="tel" placeholder="e.g. +91 98765 43210" id="newAddrPhone">
              </div>
            </div>
            <button class="btn-primary" onclick="addAddress()">Save Address</button>
          </div>
          </div>
        </div>
      </main>
    </div>
  </div>

   <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
