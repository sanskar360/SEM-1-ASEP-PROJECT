<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users — Vega Vastra Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin_style.css') }}">
</head>
<body>

<div class="admin-layout">

    <aside class="admin-sidebar" id="adminSidebar">
    <div class="sidebar-brand">
        <a href="#" class="brand-name"><img src="Logo.png" alt="Vega Vastra" class="sidebar-logo-img"></a>
        <span class="brand-role">⚙️ Admin Portal</span>
    </div>
    <nav class="sidebar-nav">
        <span class="nav-section-label">Management</span>
        <a href="admin_users_table.html" class="nav-link active">
            <span class="nl-icon">👥</span>
            <span>User Information</span>
        </a>
        <a href="admin_orders_table.html" class="nav-link">
            <span class="nl-icon">📦</span>
            <span>Orders</span>
        </a>
        <a href="admin_payments.html" class="nav-link">
            <span class="nl-icon">💳</span>
            <span>Payments</span>
        </a>
        <a href="admin_vendors.html" class="nav-link">
            <span class="nl-icon">🏪</span>
            <span>Vendors</span>
        </a>
        <a href="admin_delivery_boys.html" class="nav-link">
            <span class="nl-icon">🛵</span>
            <span>Delivery Boys</span>
        </a>
        <span class="nav-section-label">Account</span>
        <a href="#" class="nav-link">
            <span class="nl-icon">👤</span>
            <span>Profile</span>
        </a>
    </nav>
    <div class="sidebar-footer">
        <a href="#" class="logout-link">
            <span class="nl-icon">🚪</span>
            <span>Logout</span>
        </a>
    </div>
</aside>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <div class="admin-main">

        <header class="admin-topbar">
            <div style="display:flex; align-items:center; gap:14px;">
                <button class="hamburger" onclick="openSidebar()" aria-label="Open menu">
                    <span></span><span></span><span></span>
                </button>
                <span class="topbar-title">User Information</span>
            </div>
            <div class="topbar-right">
                <div class="topbar-avatar">AD</div>
            </div>
        </header>

        <main class="admin-content">

            <div class="page-header">
                <h1>Users Details</h1>
                <p>All registered customer accounts</p>
            </div>

            <div class="table-card">
                <div class="table-card-header">
                    <h2>Registered Users</h2>
                    <input type="text" class="search-bar" placeholder="🔍  Search users..." oninput="filterTable(this, 'usersTable')">
                </div>

                <div class="table-wrap">
                    <table class="db-table" id="usersTable">
                        <thead>
                            <tr>
                                <th>SR.</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Password</th>
                            </tr>
                        </thead>
                        <tbody>
                            
                            <tr>
                                <td data-label="SR.">—</td>
                                <td data-label="Username" class="td-bold">—</td>
                                <td data-label="Email" style="font-size:13px;">—</td>
                                <td data-label="Password" style="font-family:monospace; font-size:12px; color:var(--text-muted);">—</td>
                            </tr>
                            
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>

<script>
function openSidebar() {
    document.getElementById('adminSidebar').classList.add('open');
    document.getElementById('sidebarOverlay').classList.add('open');
}
function closeSidebar() {
    document.getElementById('adminSidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('open');
}
function filterTable(input, tableId) {
    const filter = input.value.toLowerCase();
    const rows = document.getElementById(tableId).querySelectorAll('tbody tr');
    rows.forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(filter) ? '' : 'none';
    });
}
</script>
</body>
</html>
