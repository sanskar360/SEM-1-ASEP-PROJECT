<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title> Payments </title>
</head>
<body>
     <nav>
            {% include 'nav.html' %}
    </nav>
    <h2 class="t1">Your Payment Details</h2>
    <div class="table">
        <table class="order-table">
            <thead>
                <tr>
                    <th>SR. NO.</th>
                    <th>Date</th>
                    <th>Order Status</th>
                    <th>Payment Method</th>
                    <th>Payment Status</th>
                </tr>
            </thead>
             <tbody>
                {% for order in orders %}
                    <tr>
                        <td>{{ loop.index }}</td>
                        <td>{{ order.order_date }}</td>
                        <td>{{ order.order_status }}</td>
                        <td>{{ order.patment_method}}</td>
                       <td>
                            <form method="POST" action="{{ url_for('payments') }}">
                                <input type="hidden" name="order_id" value="{{ order.id }}">
                                
                                <select name="payment_status">
                                    <option value="Pending" {% if order.payment_status == 'Pending' %}selected{% endif %}>
                                        Pending
                                    </option>

                                    <option value="Paid" {% if order.payment_status == 'Paid' %}selected{% endif %}>
                                        Paid
                                    </option>
                                </select>
                                <button type="submit">Update</button>
                            </form>
                        </td>
                    </tr>
                {% endfor %}    
            </tbody>
        </table>
    </div>
</body>
</html>
